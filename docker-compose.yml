services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: trend_trader:mainnet
    container_name: trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # build_daily_cache reads $BINANCE_KLINES_DIR/klines/processed/daily_closes.parquet
      BINANCE_KLINES_DIR: /app/binance-klines
      SHADOW_SIZING: ${SHADOW_SIZING:-false}
      DRY_RUN: ${DRY_RUN:-false}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      # read-only bind-mount of the binance-klines producer's data dir (same as testnet)
      - ~/projects/binance-klines:/app/binance-klines:ro
    networks:
      - binance-net
    command: python -m src.main

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:mainnet
    container_name: dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BINANCE_KLINES_DIR: /app/binance-klines
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - ~/projects/binance-klines:/app/binance-klines:ro
    networks:
      - binance-net
    ports:
      - "8050:8050"
    command: python -m src.dashboard.app

  cache-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:cache-builder
    container_name: cache-builder
    restart: no
    cpus: 1.5
    env_file:
      - .env
    environment:
      BINANCE_KLINES_DIR: /app/binance-klines
    volumes:
      - ./data:/app/data
      - ~/projects/binance-klines:/app/binance-klines:ro
    networks:
      - binance-net
    command: python scripts/build_daily_cache.py

  trader-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:testnet
    container_name: trader-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    environment:
      BINANCE_KLINES_DIR: /app/binance-klines
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - ~/projects/binance-klines:/app/binance-klines:ro
    networks:
      - binance-net
    command: python -m src.main

  dashboard-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:testnet
    container_name: dashboard-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    environment:
      BINANCE_KLINES_DIR: /app/binance-klines
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - ~/projects/binance-klines:/app/binance-klines:ro
    networks:
      - binance-net
    ports:
      - "8051:8050"
    command: python -m src.dashboard.app

networks:
  binance-net:
    external: true