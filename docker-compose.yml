services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: trader
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    command: python -m src.main

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    ports:
      - "8050:8050"
    command: python -m src.dashboard.app

  trader-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: trader-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    command: python -m src.main

  dashboard-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dashboard-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
    ports:
      - "8051:8050"
    command: python -m src.dashboard.app