services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:mainnet
    container_name: trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BINANCE_DATA_ROOT: /app
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - binance-klines:/app/klines
    networks:
      - binance-net
    command: python -m src.main

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:mainnet
    container_name: dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BINANCE_DATA_ROOT: /app
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - binance-klines:/app/klines
    networks:
      - binance-net
    ports:
      - "8050:8050"
    command: python -m src.dashboard.app

  cache-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:cache-builder
    container_name: cache-builder
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 3g
    env_file:
      - .env
    environment:
      BINANCE_DATA_ROOT: /app
    volumes:
      - ./data:/app/data
      - binance-klines:/app/klines
    networks:
      - binance-net
    command: python scripts/build_daily_cache.py

  trader-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:testnet
    container_name: trader-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    environment:
      BINANCE_DATA_ROOT: /app
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - binance-klines:/app/klines
    networks:
      - binance-net
    command: python -m src.main

  dashboard-testnet:
    profiles: [testnet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trend_trader:testnet
    container_name: dashboard-testnet
    restart: unless-stopped
    env_file:
      - .env
      - .env.testnet
    environment:
      BINANCE_DATA_ROOT: /app
    volumes:
      - ./logs-testnet:/app/logs
      - ./state:/app/state
      - ./data:/app/data
      - binance-klines:/app/klines
    networks:
      - binance-net
    ports:
      - "8051:8050"
    command: python -m src.dashboard.app

volumes:
  binance-klines:
    external: true

networks:
  binance-net:
    external: true